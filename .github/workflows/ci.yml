name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ci/test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: petpulse_api_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, intl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure test database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: petpulse_api_test
          DB_USERNAME: root
          DB_PASSWORD: root
          PETPULSE_WEBHOOK_SECRET: AR9q6eCSYbPjhdfyjadgtfe
        run: |
          php artisan config:clear
          php artisan migrate --force

      - name: Run PHPUnit tests
        env:
          APP_ENV: testing
          APP_KEY: base64:u9bWp5CZZ2hqiotXzntFzFJ4ETPBj+Zb1p85fzhlLpE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: petpulse_api_test
          DB_USERNAME: root
          DB_PASSWORD: root
          PETPULSE_WEBHOOK_SECRET: AR9q6eCSYbPjhdfyjadgtfe
        run: php artisan test

      - name: Run PHP CS Fixer (PSR-12 check)
        run: ./vendor/bin/pint --test
        continue-on-error: true
